<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBridge Technologies - Mobile Preview</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        .preview-container {
            max-width: 414px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        .phone-frame {
            background: #000;
            padding: 10px;
            border-radius: 30px;
        }
        .phone-screen {
            background: white;
            height: 896px;
            overflow-y: auto;
            border-radius: 20px;
            position: relative;
        }
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        .iframe-container {
            width: 100%;
            height: 100%;
            border: none;
        }
        .instructions {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
        .resize-handle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #007AFF;
            border-radius: 50%;
            cursor: nwse-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h2>📱 SkyBridge Technologies Mobile Preview</h2>
        <p>This preview simulates an iPhone X/11/12 screen size (375x896px)</p>
        <p>You can resize the preview by dragging the blue handle in the corner</p>
    </div>
    
    <div class="preview-container" id="preview-container">
        <div class="phone-frame">
            <div class="phone-screen">
                <div class="notch"></div>
                <iframe src="Index.html" class="iframe-container" id="mobile-frame"></iframe>
            </div>
        </div>
        <div class="resize-handle" id="resize-handle">↘</div>
    </div>

    <script>
        // Make the preview resizable
        const container = document.getElementById('preview-container');
        const resizeHandle = document.getElementById('resize-handle');
        let isResizing = false;
        let startX, startY, startWidth, startHeight;

        resizeHandle.addEventListener('mousedown', (e) => {
            isResizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startWidth = parseInt(document.defaultView.getComputedStyle(container).width, 10);
            startHeight = parseInt(document.defaultView.getComputedStyle(container).height, 10);
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            
            const newWidth = startWidth + e.clientX - startX;
            const newHeight = startHeight + e.clientY - startY;
            
            // Constrain to reasonable mobile dimensions
            if (newWidth >= 320 && newWidth <= 600) {
                container.style.width = newWidth + 'px';
            }
            if (newHeight >= 500 && newHeight <= 1200) {
                container.style.height = newHeight + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            isResizing = false;
        });

        // Set initial iPhone-like dimensions
        container.style.width = '414px';
        container.style.height = '916px';
    </script>
</body>
</html>
